[project]
name = "ml-snp500"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rick Dennison", email = "rdennison12@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.30.0",
    "yfinance>=1.7.0",
]

[project.scripts]
ml-snp500 = "ml_snp500:main"
ml-snp500-web = "ml_snp500.web:run"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
